[project]
name = "01"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "afrancois-dev", email = "86873841+afrancois-dev@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.25.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["01"]

[dependency-groups]
ci = [
    "ruff>=0.15.8,<0.16.0", # formating and linting
    "yamllint>=1.38.0,<1.39.0", # yaml linting
    "ty>=0.0.26,<0.0.27", # type checking
    ]

dev = [
    {include-group = "ci"},
    "prek",
    "marimo>=0.14.5",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<1",
]

[tool.uv]
default-groups = ["ci"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
